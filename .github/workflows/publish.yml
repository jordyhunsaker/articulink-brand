name: Publish to GitHub Packages

# Publishes @articulink/brand to GitHub Packages (npm.pkg.github.com)
# when a GitHub release is published, or manually via workflow_dispatch.
#
# AUTH: the package scope (@articulink) belongs to the Articulink org while
# this repository lives under a personal account, so the workflow-provided
# GITHUB_TOKEN cannot publish it. Add a repository secret named
# GH_PACKAGES_TOKEN containing a classic PAT (from an Articulink org
# owner/admin) with the `write:packages` scope. If this repo is ever
# transferred into the Articulink org, the fallback to GITHUB_TOKEN below
# starts working and the secret can be deleted.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@articulink"

      - run: npm ci

      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "v${PKG_VERSION}" != "${TAG}" ] && [ "${PKG_VERSION}" != "${TAG}" ]; then
            echo "::error::package.json version (${PKG_VERSION}) does not match release tag (${TAG})"
            exit 1
          fi

      - name: Check publish credentials
        env:
          HAS_PAT: ${{ secrets.GH_PACKAGES_TOKEN != '' }}
        run: |
          if [ "${HAS_PAT}" != "true" ] && [ "${{ github.repository_owner }}" != "Articulink" ]; then
            echo "::error::GH_PACKAGES_TOKEN secret is not set. GITHUB_TOKEN can only publish to the @${{ github.repository_owner }} scope, but this package is @articulink/brand. Add a classic PAT with write:packages from an Articulink org admin as the GH_PACKAGES_TOKEN repository secret."
            exit 1
          fi

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
